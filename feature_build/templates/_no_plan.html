{# Shown above the calendar when there is no active plan. #}
{% if not active %}
  <div class="no-plan">
    <div>
      <strong>You don't have a training plan yet.</strong>
      <span class="muted">Create one and your runs will show up in this calendar.</span>
    </div>
    <a class="button primary" href="{{ url_for('new_plan') }}">Create plan</a>
  </div>
{% endif %}
