<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Race Training Planner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('week') }}">🏃 Race Training Planner</a>
    {% if session.user_id %}
      <nav>
        <a href="{{ url_for('week') }}">Week</a>
        <a href="{{ url_for('setup') }}">Setup</a>
        <span class="muted">{{ session.username }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <button class="link-button">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
