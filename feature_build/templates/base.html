<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Race Training Planner{% endblock %} · Build 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <span class="brand">🏃 Race Training Planner <small>· Build 1 (feature-wise)</small></span>
    {% if session.user_id %}
      <nav>
        <a href="{{ url_for('week') }}">Calendar</a>
        <a href="{{ url_for('plans') }}">Plans</a>
        <a href="{{ url_for('profile') }}">Profile</a>
        <span class="muted">{{ session.username }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <button class="link-button">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
