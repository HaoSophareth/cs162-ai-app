{% extends "base.html" %}
{% block title %}Edit run{% endblock %}
{% block content %}
<p><a href="{{ url_for('main.run_detail', run_id=run.id) }}">&larr; Back to run</a></p>

<div class="panel narrow">
  <h1>Edit {{ run.run_type }} run</h1>
  <form method="post">
    <label>Date (change it to move the run to another day)
      <input type="date" name="date" value="{{ run.date.isoformat() }}" required>
    </label>
    <label>Distance (km)
      <input type="number" name="distance_km" value="{{ '%g' % run.distance_km }}" min="0.1" step="0.1" required>
    </label>
    <label>Notes
      <textarea name="notes" rows="4">{{ run.notes }}</textarea>
    </label>
    <button type="submit" class="button">Save</button>
    <a class="button secondary" href="{{ url_for('main.run_detail', run_id=run.id) }}">Cancel</a>
  </form>
</div>
{% endblock %}
